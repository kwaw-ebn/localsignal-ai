services:
  - type: web
    name: localsignal-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://localsignal-web.onrender.com
  - type: web
    name: localsignal-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
