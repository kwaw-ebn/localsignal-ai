databases:
  - name: localsignal-db
    databaseName: localsignal
    user: localsignal
    plan: free
services:
  - type: web
    name: localsignal-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: {name: localsignal-db, property: connectionString}
      - key: AUTH_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
    preDeployCommand: alembic upgrade head
  - type: web
    name: localsignal-web
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
