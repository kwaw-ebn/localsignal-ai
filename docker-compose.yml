services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: localsignal
      POSTGRES_USER: localsignal
      POSTGRES_PASSWORD: localpassword
    ports: ["5432:5432"]
    volumes: ["localsignal_data:/var/lib/postgresql/data"]
  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://localsignal:localpassword@database:5432/localsignal
      AUTH_SECRET: local-development-only-secret
      CORS_ORIGINS: http://localhost:5173
    ports: ["8000:8000"]
    depends_on: [database]
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
volumes:
  localsignal_data:
